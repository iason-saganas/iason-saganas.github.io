<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
  <link rel="stylesheet" href="{{ '/assets/minimal.css' | relative_url }}">
</head>
<body>
  <main>
    {{ content }}
  </main>
  <footer>
    <hr>
    <p class="modified">Last modified: {{ site.time | date: "%-d %B %Y" }}</p>
  </footer>
</body>
</html>
